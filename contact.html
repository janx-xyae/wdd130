<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
        content="Contact White Water Rafting for reservations, general inquiries, and website suggestions.">

    <meta name="author" content="Hannah Ramirez">

    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>

    
    <header>

    <img src="images/logo.png" alt="Rafting Logo">

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="trips.html">Trips</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

</header>

    
    <main>

        <section class="contact-info">

            <h1>White Water Rafting Company</h1>

            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 (999) 999-9999</p>
            <p>info@whitewater.com</p>

        </section>



        <section class="contact-container">

            <div class="map">

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3302.1234567890123!2d-112.12345678901234!3d37.12345678901234!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c1234567890123%3A0x1234567890123456!2s123%20Main%20River%20St%2C%20Kolob%2C%20CA%2099999!5e0!3m2!1sen!2sus!4v1234567890123"
                    width="600"
                    height="450"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

            <div class="contact-form">

                <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required>

                    <fieldset>

                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>

                    </fieldset>

                    <label for="message">Message</label>

                    <textarea id="message" name="message" placeholder="Type here" rows="6"></textarea>

                    <label class="checkbox">

                        <input type="checkbox" name="newsletter">

                        Please subscribe me to the monthly newsletter

                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>

        </section>



        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-cards">

                <figure>

                    <img src="images/employee1.jpg" alt="Lead River Guide">

                    <figcaption>
                        Sarah Johnson<br>
                        Lead River Guide
                    </figcaption>

                </figure>

                <figure>

                    <img src="images/employee2.jpg" alt="Safety Instructor">

                    <figcaption>
                        Michael Brown<br>
                        Safety Instructor
                    </figcaption>

                </figure>

                <figure>

                    <img src="images/employee3.jpg" alt="Reservations Manager">

                    <figcaption>
                        Emily Davis<br>
                        Reservations Manager
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 White Water Rafting | Hannah Ramirez</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>

        </nav>

    </footer>

</body>

</html>
